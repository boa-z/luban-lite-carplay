name: D213 firmware
on:
  push:
    branches: [carplay-oss]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-regressions:
    name: Luban-Lite adapters (ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Fetch portable SDK host cryptography dependency
        run: packages/third-party/rt-carplay/scripts/fetch-mbedtls.sh
      - name: Check actual composition, media, pairing and transports
        run: make -C application/rt-thread/rtcarplay -j8 check
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [gui, headless]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patch dosfstools mtools device-tree-compiler u-boot-tools
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r .ci/requirements.txt
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Check baremetal OSAL and USB regressions
        run: |
          bash packages/third-party/cherryusb-luban/tests/run_baremetal.sh
          bash packages/third-party/cherryusb-luban/tests/run.sh
          bash packages/third-party/cherryusb-luban/tests/run_control_probe.sh
      - name: Check video handoff and SDK framebuffer command ABI
        run: make -C application/rt-thread/rtcarplay check-lubanlite-video SDK_ROOT="$GITHUB_WORKSPACE"
      - name: Check application connection manager and launcher input
        run: make -C application/rt-thread/rtcarplay check-lubanlite-demo SDK_ROOT="$GITHUB_WORKSPACE"
      - name: Build Bootloader and complete IMG
        env:
          PYTHONUNBUFFERED: '1'
        run: bash .ci/build-firmware.sh '${{ matrix.variant }}'
      - name: Upload firmware and build identity
        uses: actions/upload-artifact@v4
        with:
          name: d213-carplay-${{ matrix.variant }}-${{ github.sha }}
          path: output/ci/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d213-carplay-${{ matrix.variant }}-failure-logs
          path: output/ci-logs/
          if-no-files-found: ignore
