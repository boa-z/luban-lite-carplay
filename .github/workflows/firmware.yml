name: D213 firmware
on:
  push:
    branches: [carplay-oss]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Host regressions and LVGL renders
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SDK and integration Host regressions
        run: |
          set -euo pipefail
          mkdir -p output/host
          python3 -m pip install clang-format==23.1.1
          python3 packages/third-party/rt-carplay/scripts/format-code.py --check
          python3 packages/third-party/rt-carplay/scripts/format-code.py --root application/rt-thread/rtcarplay --check
          make -C application/rt-thread/rtcarplay check-docs
          bash packages/third-party/rt-carplay/scripts/fetch-mbedtls.sh
          make -C packages/third-party/rt-carplay -j8 check 2>&1 | tee output/host/sdk.log
          make -C application/rt-thread/rtcarplay -j8 check 2>&1 | tee output/host/integration.log
      - name: Render the actual LVGL launcher and fusion strip
        run: |
          set -euo pipefail
          cmake -S application/rt-thread/rtcarplay/tests/launcher_preview -B output/host-preview -DCMAKE_BUILD_TYPE=Debug
          cmake --build output/host-preview -j8
          mkdir -p output/host/screens
          output/host-preview/launcher_preview output/host/screens
          output/host-preview/fusion_preview output/host/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carplay-host-${{ github.sha }}
          path: output/host/
  firmware:
    needs: host
    name: Build and publish nightly firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake patch dosfstools mtools device-tree-compiler u-boot-tools cpio
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r .ci/requirements.txt
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Build and validate Bootloader, IMG and CPIO
        env:
          PYTHONUNBUFFERED: '1'
        run: bash .ci/build-firmware.sh
      - name: Write release notes
        run: |
          set -euo pipefail
          images=(output/ci/*.img)
          asset=$(basename "${images[0]}")
          cat > output/ci/NOTES.md <<EOF
          Nightly firmware for commit \`${GITHUB_SHA}\`. Hardware validation: **NOT_RUN**.

          - [\`ota.cpio\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/ota.cpio) is the online update package. On devices with the CPIO updater, paste its URL into Settings → System update → Firmware URL. Download it and confirm installation to update the inactive OS and Rodata pair and preserve \`/data\`.
          - [\`${asset}\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/${asset}) is the full USB installation and recovery image. Devices already on A/B baseline 2 can install this IMG once through their existing IMG updater to migrate to CPIO.

          \`SHA256SUMS\` covers both firmware files and the source manifest.
          EOF

      - name: Upload development firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d213-carplay-${{ github.sha }}
          path: output/ci/
          if-no-files-found: ignore
          retention-days: 14
      # A [ultra-dev] milestone still builds and uploads the image above, but
      # does not replace the rolling release until it is reviewed.
      - name: Publish rolling nightly release
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[ultra-dev]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Nightly firmware ${GITHUB_SHA:0:8}"
          assets=(output/ci/*.img output/ci/ota.cpio output/ci/SHA256SUMS output/ci/source-manifest.txt)
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${assets[@]}" --clobber
            gh release edit nightly --title "$title" --notes-file output/ci/NOTES.md --prerelease --latest=false
          else
            gh release create nightly "${assets[@]}" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "$title" --notes-file output/ci/NOTES.md
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
      - name: Preserve build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-${{ github.sha }}
          path: output/ci-logs/
          if-no-files-found: ignore
