name: D213 firmware
on:
  push:
    branches: [carplay-oss]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    name: Build and publish preview firmware
    # Ultra milestones use ultra-demo.yml artifacts until separately approved
    # for the rolling Classic release. Keep ordinary preview pushes unchanged.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[ultra-dev]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # The workflow's only product is the rolling preview release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake patch dosfstools mtools device-tree-compiler u-boot-tools cpio
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r .ci/requirements.txt
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Test OTA, wired integration and actual LVGL launcher
        run: |
          bash packages/third-party/rt-carplay/scripts/fetch-mbedtls.sh
          make -C application/rt-thread/rtcarplay check-ota
          make -C application/rt-thread/rtcarplay check-native-ncm check-lubanlite-usb check-wired-identity check-wired-trace check-iap2-endpoints check-usb-iap2-worker
          cmake -S application/rt-thread/rtcarplay/tests/launcher_preview -B output/launcher-preview -DCMAKE_BUILD_TYPE=Debug
          cmake --build output/launcher-preview -j8
          mkdir -p output/launcher-screens
          output/launcher-preview/launcher_preview output/launcher-screens
      - name: Build Bootloader and complete IMG
        env:
          PYTHONUNBUFFERED: '1'
        run: bash .ci/build-firmware.sh
      - name: Write release notes
        run: |
          cat > output/ci/NOTES.md <<EOF
          Preview firmware for commit \`${GITHUB_SHA}\`.

          This is an automatically replaced prerelease: every push to
          \`carplay-oss\` overwrites the \`preview\` assets below. It has not
          received the board acceptance listed in
          [\`media-transport-repair.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/application/rt-thread/rtcarplay/docs/media-transport-repair.md).

          | Asset | Purpose |
          |---|---|
          | \`d213-carplay.img\` | Full USB image with the A/B bootloader |
          | \`ota.cpio\` | A/B OTA package |
          | \`bootloader.bin\` | A/B bootloader |
          | \`version.txt\` | Board, version, commit, package size and SHA256 for the update check |
          | \`SHA256SUMS\` | Asset checksums |

          ## Installing

          1. A device still running a pre-A/B firmware must first flash the
             \`d213-carplay.img\` over USB. That image contains the A/B
             bootloader and the env layout; OTA alone cannot switch slots
             until this one-time migration is done.
          2. Afterwards, use Settings → FIRMWARE & UPDATES, or run
             \`carplay_ota check\`, inspect \`carplay_ota status\`, then
             explicitly run \`carplay_ota install\` in the console.
          3. On the device, Settings → FIRMWARE & UPDATES runs the nightly
             channel: it compares the commit compiled into the running image
             with \`commit=\` in \`version.txt\` and reports any difference as an
             update. Nothing is installed until the on-screen confirmation;
             the install stages the package in \`/data\`, verifies its size
             and SHA256, writes the inactive slot and reboots. Disconnect
             CarPlay before installing and keep power connected.
          4. \`/data\` is not part of the OTA package: Bluetooth bonds and
             settings survive an update.

          The board-side download is wired Ethernet (\`e0\`) only. The iPhone
          USB link (\`n0\`) is not an Internet uplink.
          EOF

      - name: Publish rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Preview firmware ${GITHUB_SHA:0:8}"
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --title "$title" --notes-file output/ci/NOTES.md --prerelease
          else
            gh release create preview --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes-file output/ci/NOTES.md
          fi
          gh release upload preview \
            output/ci/d213-carplay.img \
            output/ci/ota.cpio \
            output/ci/bootloader.bin \
            output/ci/SHA256SUMS \
            output/ci/source-manifest.txt \
            --clobber
          # Publish the authorization manifest after the corresponding assets.
          gh release upload preview output/ci/version.txt --clobber
          # Keep the rolling tag pointing at this build; the asset URLs do not
          # change. Best effort: a protected tag still leaves the assets updated.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/preview" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || true
      - name: Preserve build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-${{ github.sha }}
          path: output/ci-logs/
          if-no-files-found: ignore
