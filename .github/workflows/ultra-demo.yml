name: D213 CarPlay Ultra development
on:
  push:
    branches: [carplay-oss]
    paths:
      - 'application/rt-thread/rtcarplay/**'
      - 'packages/third-party/rt-carplay'
      - 'target/configs/*rtcarplay_ultra*'
      - '.ci/build-ultra-demo.sh'
      - '.github/workflows/ultra-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultra-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: SDK and integration Host regressions
        run: |
          set -euo pipefail
          mkdir -p output/ultra-host
          bash packages/third-party/rt-carplay/scripts/fetch-mbedtls.sh
          make -C packages/third-party/rt-carplay -j8 check 2>&1 | tee output/ultra-host/sdk.log
          make -C application/rt-thread/rtcarplay -j8 check 2>&1 | tee output/ultra-host/integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carplay-ultra-host-${{ github.sha }}
          path: output/ultra-host/
  firmware:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [gui, headless]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake patch dosfstools mtools device-tree-compiler u-boot-tools cpio
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r .ci/requirements.txt
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Build dedicated Ultra development image
        env:
          PYTHONUNBUFFERED: '1'
        run: bash .ci/build-ultra-demo.sh '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d213-carplay-ultra-${{ matrix.variant }}-${{ github.sha }}
          path: output/ultra-ci/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
